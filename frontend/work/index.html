<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-cfg-title>Blog-OS</title>
<meta name="description" data-cfg-attr="content:description" content="">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<script src="/config.js"></script>
</head>
<body class="page">

<div id="cross" aria-hidden="true" title="回到顶部">
<svg viewBox="0 0 30 30"><path d="M15 5v20M5 15h20"/></svg>
</div>

<header class="topbar">
<a class="brand" href="/"><span data-cfg="siteName">Blog</span> <span class="sec">/ work</span></a>
<a href="/">← 首页</a>
</header>

<main class="sheet">
<a class="back" href="/">← <span data-cfg="siteName">Blog</span></a>
<p class="label"><span class="n">03</span>Work · 项目</p>
<h1 class="page-title">WORK</h1>
<p class="page-sub">做过的东西。</p>
<div class="rows" id="work-rows"></div>
</main>

<footer class="colophon">
<span>© <span id="year">2026</span> <span data-cfg="siteName">Blog</span> · 已运行 <b><span id="days">1</span></b> 天</span>
<span data-cfg="footer.motto"></span>
</footer>

<script src="/assets/main.js"></script>
<script>
(function () {
  var CFG = window.SITE_CONFIG || {};
  var box = document.getElementById("work-rows");
  (CFG.work || []).forEach(function (w) {
    var a = document.createElement("a");
    a.className = "row";
    a.href = w.href;
    var esc = function (s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    };
    a.innerHTML = '<span class="arr">→</span><span class="t">' + esc(w.title) +
      '</span><span class="k">' + esc(w.tag || "") + "</span>";
    box.appendChild(a);
  });
})();
</script>
</body>
</html>
