<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-cfg-title>Blog-OS</title>
<meta name="description" data-cfg-attr="content:description" content="">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
<script src="/config.js"></script>
</head>
<body class="page">

<div id="cross" aria-hidden="true" title="回到顶部">
<svg viewBox="0 0 30 30"><path d="M15 5v20M5 15h20"/></svg>
</div>

<header class="topbar">
<a class="brand" href="/"><span data-cfg="siteName">Blog</span> <span class="sec">/ sites</span></a>
<a href="/">← 首页</a>
</header>

<main class="sheet">
<a class="back" href="/">← <span data-cfg="siteName">Blog</span></a>
<p class="label"><span class="n">04</span>Sites · 站点</p>
<h1 class="page-title">SITES</h1>
<p class="page-sub">站点矩阵。</p>
<div class="cards" id="site-cards"></div>
</main>

<footer class="colophon">
<span>© <span id="year">2026</span> <span data-cfg="siteName">Blog</span> · 已运行 <b><span id="days">1</span></b> 天</span>
<span data-cfg="footer.motto"></span>
</footer>

<script src="/assets/main.js"></script>
<script>
(function () {
  var CFG = window.SITE_CONFIG || {};
  var box = document.getElementById("site-cards");
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  (CFG.sites || []).forEach(function (s) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = s.href;
    a.innerHTML = "<b>" + esc(s.title) + "</b><i>" + esc(s.sub || "") + " →</i>";
    box.appendChild(a);
  });
})();
</script>
</body>
</html>
